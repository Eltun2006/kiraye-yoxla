# Render's free plan puts the service to sleep after 15 minutes without traffic; the next visitor
# then waits ~1 minute for a cold start. This job pings a cheap endpoint (/health: no DB, no Gemini)
# often enough that the service never goes idle.
#
# Note: GitHub may start scheduled jobs a few minutes late, so the interval is kept well under 15 min.
# The site URL comes from the repository variable SITE_URL (Settings → Secrets and variables →
# Actions → Variables); without it the default Render address below is used.
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (UTC)
  workflow_dispatch:          # "Run workflow" button for a manual test

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://kiraye-yoxla.onrender.com' }}
        run: |
          # A cold start can take ~60 s, so allow retries with a generous timeout.
          curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 90 \
            "$SITE_URL/health"
